[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "matresearcher"
version = "0.1.0"
description = "MatResearcher: Multi-agent literature survey system for solid-state battery materials"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "langgraph>=0.2.0",
    "pydantic>=2.0",
    "httpx>=0.27",
    "openai>=1.30",
    "chromadb>=0.5.0",
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "typer>=0.12",
    "tenacity>=8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
matresearcher = "matresearcher.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
