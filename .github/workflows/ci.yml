name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # requires-python>=3.13：只测 3.13（依赖文件已统一为 pyproject.toml 单一来源）
    env:
      UNPAYWALL_EMAIL: ""   # CI 不跑 pdf 下载；如需 OA PDF 可改用 repo secret 注入
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        # Installs the package without torch/transformers from PyPI indexes that
        # are slow and large; the test suite only needs the rule layer, the
        # models and the workflow routers, none of which import them eagerly.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Smoke import
        run: python -c "import matresearcher, matresearcher.workflow.engine, matresearcher.evaluation"

      - name: Pytest
        run: python -m pytest tests/ -q

      - name: Rule-layer smoke gate (zero-token)
        run: python scripts/smoke_quality_gate.py || true
        continue-on-error: true
